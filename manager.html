<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Managers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Manage Managers</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="trainer.html">Trainers</a></li>
            <li><a href="trainee.html">Trainees</a></li>
        </ul>
    </nav>
    <main>
        <h2>Add New Manager</h2>
        <form id="add-manager-form">
            <input type="text" name="Name" placeholder="Name" required>
            <input type="text" name="Contact_Number" placeholder="Contact Number" required>
            <input type="email" name="Email_id" placeholder="Email" required>
            <button type="submit">Add Manager</button>
        </form>

        <h2>Existing Managers</h2>
        <table id="managers-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Contact Number</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </main>
    <script src="js/manager.js"></script>
</body>
</html>
