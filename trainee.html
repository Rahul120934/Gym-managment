<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Trainees</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Manage Trainees</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="manager.html">Managers</a></li>
            <li><a href="trainer.html">Trainers</a></li>
        </ul>
    </nav>
    <main>
        <h2>Add New Trainee</h2>
        <form id="add-trainee-form">
            <input type="text" name="Name" placeholder="Name" required>
            <input type="email" name="Email" placeholder="Email" required>
            <input type="password" name="Password" placeholder="Password" required>
            <input type="text" name="Gender" placeholder="Gender">
            <textarea name="Training_Plan" placeholder="Training Plan"></textarea>
            <input type="text" name="Contact_number" placeholder="Contact Number">
            <input type="number" name="Age" placeholder="Age">
            <input type="number" name="Height" placeholder="Height (cm)">
            <input type="number" name="Weight" placeholder="Weight (kg)">
            <input type="number" name="Trainer_id" placeholder="Trainer ID" required>
            <button type="submit">Add Trainee</button>
        </form>

        <h2>Existing Trainees</h2>
        <table id="trainees-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Gender</th>
                    <th>Training Plan</th>
                    <th>Contact Number</th>
                    <th>Age</th>
                    <th>Height</th>
                    <th>Weight</th>
                    <th>Trainer ID</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </main>
    <script src="js/trainee.js"></script>
</body>
</html>
