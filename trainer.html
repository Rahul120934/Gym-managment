<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Trainers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Manage Trainers</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="manager.html">Managers</a></li>
            <li><a href="trainee.html">Trainees</a></li>
        </ul>
    </nav>
    <main>
        <h2>Add New Trainer</h2>
        <form id="add-trainer-form">
            <input type="text" name="Name" placeholder="Name" required>
            <input type="email" name="Email_id" placeholder="Email" required>
            <input type="password" name="Password" placeholder="Password" required>
            <input type="text" name="Contact_Number" placeholder="Contact Number">
            <input type="number" name="Manager_id" placeholder="Manager ID" required>
            <button type="submit">Add Trainer</button>
        </form>

        <h2>Existing Trainers</h2>
        <table id="trainers-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Contact Number</th>
                    <th>Manager ID</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </main>
    <script src="js/trainer.js"></script>
</body>
</html>
